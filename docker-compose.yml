# Single-container compose. The API serves both /api/* and the SPA from
# /app/public via Fastify static.
#
# Required .env:
#   MASTER_KEY=$(openssl rand -base64 32)
#   SESSION_SECRET=$(openssl rand -base64 48)
#
# Optional .env knobs:
#   API_PORT=3001                        # internal Fastify port AND host
#                                        #   binding (1:1 mapping). To map
#                                        #   a different host port without
#                                        #   touching Fastify, edit the
#                                        #   `ports:` line below directly.
#   PUBLIC_BASE_URL=http://localhost:3001
#   CORS_ORIGIN=http://localhost:3001    # only matters if you expose
#                                        # the app under a different host

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATA_DIR: /data
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${API_PORT:-3001}}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${API_PORT:-3001}}
      # Set true to keep the session across restarts/updates (see .env.example).
      PERSIST_SESSION_KEY: ${PERSIST_SESSION_KEY:-false}
      # Set true only behind a trusted reverse proxy (needed for the 2FA
      # trusted-network bypass to read the real client IP).
      TRUSTED_PROXY: ${TRUSTED_PROXY:-false}
      # Passkeys: set RP ID (domain) + origin (https URL) to enable. Needs a
      # domain, not an IP. Left empty here so passkeys stay off by default.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      # Set true to allow PRF-less passkeys (e.g. Bitwarden). Weaker: see .env.example.
      WEBAUTHN_ALLOW_PRFLESS: ${WEBAUTHN_ALLOW_PRFLESS:-false}
    volumes:
      - ./data:/data
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    restart: unless-stopped
